name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build runtime image
        run: docker build --pull=false --tag google-ads-mcp:ci .
      - name: Smoke-test hosted read-only runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name google-ads-mcp-ci -p 127.0.0.1:13333:3333 \
            -e PORT=3333 \
            -e GOOGLE_ADS_CREDENTIALS_JSON='{"token":"ci-token","refresh_token":"ci-refresh","token_uri":"https://oauth2.googleapis.com/token","client_id":"ci-client","client_secret":"ci-secret","expiry":"2999-01-01T00:00:00.000Z"}' \
            -e GOOGLE_ADS_DEVELOPER_TOKEN=ci-developer-token \
            -e GOOGLE_ADS_LOGIN_CUSTOMER_ID=1234567890 \
            -e ALLOWED_CUSTOMER_IDS=1234567890 \
            -e GOOGLE_ADS_READ_ONLY=true \
            -e MCP_API_KEY=ci-only-not-a-secret-32-bytes-long \
            -e MCP_ALLOWED_HOSTS=localhost,127.0.0.1 \
            google-ads-mcp:ci
          trap 'docker rm -f google-ads-mcp-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:13333/health >/dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-read-only.mjs http://localhost:13333 ci-only-not-a-secret-32-bytes-long
